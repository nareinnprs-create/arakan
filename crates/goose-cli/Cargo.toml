[package]
name = "arakan-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[lints]
workspace = true

[[bin]]
name = "arakan"
path = "src/main.rs"

[[bin]]
name = "generate_manpages"
path = "src/bin/generate_manpages.rs"

[[bin]]
name = "mcp_conformance_driver"
path = "src/bin/mcp_conformance_driver.rs"

[dependencies]
clap_mangen = { version = "0.3", default-features = false }
arakan = { path = "../arakan", default-features = false }
agent-client-protocol = { workspace = true, features = ["unstable"], optional = true }
arakan-mcp = { path = "../arakan-mcp", default-features = false, optional = true }
arakan-providers = { path = "../arakan-providers", default-features = false }
arakan-roaming = { path = "../arakan-roaming", optional = true }
rmcp = { workspace = true }
clap = { workspace = true }
cliclack = { version = "0.5", default-features = false }
console = { version = "0.16", default-features = false, features = ["std"] }
unicode-segmentation = { version = "1.12", default-features = false }
bat = { version = "0.26", default-features = false, features = ["regex-onig"] }
anyhow = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
strum = { workspace = true }
strsim = "0.11"
tempfile = { workspace = true }
etcetera = { workspace = true }
rand = { workspace = true }
rustyline = { version = "18", default-features = false, features = ["custom-bindings", "with-dirs", "with-file-history"] }
tracing = { workspace = true }
chrono = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json", "time"] }
shlex = { version = "2.0", default-features = false, features = ["std"] }
async-trait = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
tar = { version = "0.4.46", default-features = false }
reqwest = { workspace = true, features = ["blocking"] }
zip = { workspace = true }
bzip2 = { version = "0.6", default-features = false, features = ["default"] }
webbrowser = { workspace = true }
indicatif = { version = "0.18", default-features = false }
tokio-util = { workspace = true, features = ["compat", "rt"] }
anstream = { version = "1", default-features = false, features = ["auto"] }
open = { version = "5", default-features = false }
url = { workspace = true }
urlencoding = { workspace = true }
clap_complete = { version = "4", default-features = false }
comfy-table = { version = "8", default-features = false }
sha2 = { workspace = true }
axum.workspace = true
axum-server = { workspace = true, optional = true }
clap_complete_nushell = { version = "4", default-features = false }
qrcode = { version = "0.14.1", optional = true }
fs2 = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
anstream = { version = "1", default-features = false, features = ["wincon"] }
ntapi = { version = "0.4.3", default-features = false, features = ["user"] }
winapi = { workspace = true, features = [
    "consoleapi",
    "processenv",
    "winbase",
    "wincon",
] }

[target."cfg(unix)".dependencies]
libc = { version = "0.2.182", default-features = false, features = ["std"] }

[features]
default = [
    "code-mode",
    "tree-sitter",
    "local-inference",
    "aws-providers",
    "otel",
    "rustls-tls",
    "live-voice",
    "system-keyring",
    "bundled-mcp",
    "scheduler",
    "platform-apps",
    "chat-recall",
    "acp-http",
    "online-model-meta",
]
online-model-meta = ["arakan/online-model-meta"]
roaming = ["dep:arakan-roaming", "dep:qrcode", "dep:fs2", "dep:agent-client-protocol"]
code-mode = ["arakan/code-mode"]
tree-sitter = ["arakan/tree-sitter"]
live-voice = ["arakan/live-voice"]
local-inference = ["arakan/local-inference"]
aws-providers = ["arakan/aws-providers"]
cuda = ["arakan/cuda", "local-inference"]
vulkan = ["arakan/vulkan", "local-inference"]
mlx = ["arakan/mlx", "local-inference"]
otel = ["arakan/otel"]
bundled-mcp = ["dep:arakan-mcp", "arakan-mcp/bundled-mcp"]
scheduler = ["arakan/scheduler"]
platform-apps = ["arakan/platform-apps"]
chat-recall = ["arakan/chat-recall"]
acp-http = ["arakan/acp-http"]
portable-default = [
    "rustls-tls",
    "tree-sitter",
    "live-voice",
    "aws-providers",
    "otel",
    "bundled-mcp",
    "scheduler",
    "platform-apps",
    "chat-recall",
    "acp-http",
]
rustls-tls = [
    "dep:axum-server",
    "reqwest/rustls",
    "axum-server/tls-rustls",
    "arakan/rustls-tls",
    "arakan-mcp?/rustls-tls",
    "arakan-providers/rustls-tls",
]
native-tls = [
    "dep:axum-server",
    "reqwest/native-tls",
    "axum-server/tls-openssl",
    "arakan/native-tls",
    "arakan-mcp?/native-tls",
    "arakan-providers/native-tls",
]
[dev-dependencies]
env-lock.workspace = true
tempfile = { workspace = true }
test-case = { workspace = true }
tokio = { workspace = true }

[package.metadata.cargo-machete]
ignored = [
    # Used only in windows
    "winapi",
]
